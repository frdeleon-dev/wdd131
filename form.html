<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review | WDD 131</title>
    <meta name="description" content="Submit a product review by selecting a product, rating its quality, choosing useful features, and sharing your feedback.">
    <meta name="author" content="Francisco De Leon">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <div class="form-group">
                <label for="product">Product Name</label>
    
                <select id="product" name="product" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>
            </div>
            <div class="form-group">
                <p>Overall Rating *</p>
            <div class="rating">
            
                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>
            
                <input type="radio" id="star2" name="rating" value="2" required>
                <label for="star2">☆☆</label>
            
                <input type="radio" id="star3" name="rating" value="3" required>
                <label for="star3">☆☆☆</label>
            
                <input type="radio" id="star4" name="rating" value="4" required>
                <label for="star4">☆☆☆☆</label>
            
                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">☆☆☆☆☆</label>

            </div>
            </div>
    
            <div class="form-group">
                <label for="installDate">
                    Date of Installation *
                </label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
    
            <div class="form-group">
                <p>Useful Features (Check all that apply)</p>
                <div class="features">
                
                    <input type="checkbox" id="durability" name="features" value="Durability">
                
                    <label for="durability">Durability</label>
                
                    <br>
                
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                
                    <label for="ease">Ease of Use</label>
                
                    <br>
                
                    <input type="checkbox" id="performance" name="features" value="Performance">
                
                    <label for="performance">Performance</label>
                
                    <br>
                
                    <input type="checkbox" id="design" name="features" value="Design">
                
                    <label for="design">Design</label>
                
                </div>
            </div>
    
            <div class="form-group">
                <label for="review">
                    Written Review (Optional)
                </label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>
    
            <div class="form-group">
                <label for="username">
                    Your Name (Optional)
                </label>
                <input type="text" id="username" name="username">
            </div>
            <input type="submit" value="Submit Review">
        </form>
    </main>
<footer>
    <p>&copy; <span id="year"></span> Francisco De Leon | Guatemala, Guatemala</p>
    <p>Last modification: <span id="lastModified"></span></p>
</footer>
</body>
</html>
