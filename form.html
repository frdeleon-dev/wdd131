<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review | WDD 131</title>

    <meta name="description" content="Product Review Form">
    <meta name="author" content="Francisco De Leon">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <div class="form-group">
                <label for="product">Product Name</label>
    
                <select id="product" name="product" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>
            </div>
            <div class="form-group">
                <p>Overall Rating *</p>
            <div class="rating">
            
                <label><input type="radio" name="rating" id="star1" value="1" required> ☆</label>
            
                <label><input type="radio" name="rating" id="star2" value="2"> ☆☆</label>
            
                <label><input type="radio" name="rating" id="star3" value="3"> ☆☆☆</label>
            
                <label><input type="radio" name="rating" id="star4" value="4"> ☆☆☆☆</label>
            
                <label><input type="radio" name="rating" id="star5" value="5"> ☆☆☆☆☆</label>
            
            </div>
            </div>
    
            <div class="form-group">
                <label for="installDate">
                    Date of Installation *
                </label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
    
            <div class="form-group">
                <p>Useful Features (Check all that apply)</p>
                <div class="features">
                
                    <label><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
                
                    <label><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
                
                    <label><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
                
                    <label><input type="checkbox" id="design" name="features" value="Design"> Design</label>
                
                </div>
            </div>
    
            <div class="form-group">
                <label for="review">
                    Written Review (Optional)
                </label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>
    
            <div class="form-group">
                <label for="username">
                    Your Name (Optional)
                </label>
                <input type="text" id="username" name="username">
            </div>
            <input type="submit" value="Submit Review">
        </form>
    </main>
<footer>
    <p>&copy; <span id="year"></span> Francisco De Leon | Guatemala, Guatemala</p>
    <p>Last modification: <span id="lastModified"></span></p>
</footer>
</body>
</html>
