<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="WDD 131 project showcasing a responsive image album of Latter-day Saint temples with CSS grid layout and optimization.">

    <link rel="stylesheet" href="styles/temples.css">

<body>

    <header>

    </main>

    <footer>
